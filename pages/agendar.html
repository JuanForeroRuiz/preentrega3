        <div class="agendar-banner mx-3 my-3">
            <p><span class="fw-bold">¡HOLA!</span> Para cotizar tu tatuaje y enviarte toda la info de "¿Cómo agendar tu sesión?" debes llenar el

                <input type="number" id="phone_number" name="phone_number" required>

                <label for="phone">Edad</label>
                <input type="number" id="age" name="age" placeholder="Ingresa tu edad en números" required>

                    <option value="opcion1">Sombras</option>
                    <option value="opcion2">Blackwork</option>
                    <option value="opcion3">Lettering</option>
                </select>
